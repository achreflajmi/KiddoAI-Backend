spring.application.name=KiddoAI
server.address=0.0.0.0
server.port=8081

server.servlet.context-path=/KiddoAI
# Swagger : http://localhost:8081/KiddoAI/swagger-ui/index.html
### DATABASE ###
# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/KiddoAI
#Logging
logging.level.root = info
logging.pattern.console= %d{yyyy-MM-dd HH:mm:ss} -%level -%logger{60} %msg %n
spring.datasource.username=root
spring.datasource.password=
security.jwt.secret-key=${JWT_SECRET_KEY}
# 1h in millisecond
security.jwt.expiration-time=3600000
security.jwt.refresh-expiration-time=604800000

